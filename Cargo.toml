[package]
name = "source-skim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic, provenance-preserving context manifests under a token budget"
license = "MIT"
repository = "https://github.com/nicholas-ruest/source-skim"
readme = "README.md"
keywords = ["context", "provenance", "llm", "cli", "retrieval"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = "symbols"

